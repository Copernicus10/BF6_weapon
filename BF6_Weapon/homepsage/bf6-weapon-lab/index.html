<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BF6 Weapon Lab | 홈</title>
    <meta
      name="description"
      content="Battlefield 6 무기 카드와 ADS 반동 정보를 보여주는 페이지입니다."
    />
    <link rel="stylesheet" href="./assets/css/site.css" />
  </head>
  <body data-page="home">
    <div class="site-shell">
      <header class="site-header">
        <div class="brand-block">
          <p class="eyebrow">BF6 Weapon Lab</p>
          <h1>Battlefield 6 무기 차트</h1>
          <p class="subtitle">
            홈 카드에서는 무기 기본 정보와 ADS 반동만 표시합니다. 이 페이지에서는 TTK를 표시하지 않습니다.
          </p>
        </div>
        <nav class="top-nav" aria-label="Primary">
          <a class="nav-link is-active" href="./index.html">홈</a>
          <a class="nav-link" href="./ttk.html">TTK</a>
          <a class="nav-link" href="./spread.html">탄퍼짐</a>
          <a class="nav-link" href="./sources.html">출처</a>
        </nav>
      </header>

      <main class="page-content">
        <section class="hero-panel">
          <div>
            <p class="hero-label">무기 정보</p>
            <h2>AR / Carbine / SMG / MG</h2>
            <p>
              무기 카드에는 이미지, RPM, 탄속, 장탄수와 함께 ADS 기준 반동 방향, 강도, 변동이 표시됩니다.
              데이터는 <code>homepsage/data</code> 아래 JSON 파일을 사용합니다.
            </p>
          </div>
          <div class="hero-meta">
            <div class="meta-chip">
              <span class="meta-value">4</span>
              <span class="meta-label">계열</span>
            </div>
            <div class="meta-chip">
              <span class="meta-value" id="visibleWeaponCount">-</span>
              <span class="meta-label">무기</span>
            </div>
          </div>
        </section>

        <section id="homeStatus" class="status-banner">무기 카드를 불러오는 중입니다...</section>
        <section id="homeSections" class="weapon-sections" aria-live="polite"></section>
      </main>
    </div>

    <script type="module" src="./assets/js/home.js"></script>
  </body>
</html>
